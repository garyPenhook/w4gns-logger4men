name: Native platform smoke tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test ./... -run 'TestReviewNativeSmoke|TestReviewTerminalFallback|TestFindTerminalInvocation|TestSaveStationProfile|TestAudit'
      - run: go run ./cmd/w4gns-logger --version
