name: Native platform smoke tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./... -run 'TestReviewNativeSmoke|TestReviewTerminalFallback|TestFindTerminalInvocation|TestSaveStationProfile'
      - run: go run ./cmd/w4gns-logger --version
