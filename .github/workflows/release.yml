name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  native:
    uses: ./.github/workflows/native-smoke.yml
  # Tag pushes are excluded from the normal CI triggers (push to main /
  # pull_request), so without this gate a release could publish binaries that
  # never ran the test suite, or whose baked-in appVersion disagrees with the
  # tag being released. Both are checked here before any artifact is built.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race -short ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Verify tag matches appVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          appVersion="$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' cmd/w4gns-logger/main.go)"
          if [ -z "$appVersion" ]; then
            echo "could not read appVersion from main.go" >&2
            exit 1
          fi
          if [ "$tag" != "$appVersion" ]; then
            echo "tag v$tag does not match appVersion $appVersion in main.go" >&2
            exit 1
          fi
          echo "tag v$tag matches appVersion $appVersion"

  build:
    needs: [verify, native]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "w4gns-logger$ext" ./cmd/w4gns-logger

      - name: Package
        run: |
          name="w4gns-logger-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "$name.zip" w4gns-logger.exe README.md CHANGELOG.md LICENSE
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" w4gns-logger README.md CHANGELOG.md LICENSE
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing exchanges this job's GitHub OIDC token with
      # Sigstore's Fulcio for a short-lived signing certificate; no long-lived
      # private key is stored. Requires id-token: write.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Sign only the checksums manifest: it transitively covers every artifact,
      # so one signature authenticates the whole release. Verify with:
      #   cosign verify-blob --certificate SHA256SUMS.pem \
      #     --signature SHA256SUMS.sig \
      #     --certificate-identity-regexp 'https://github.com/.+/w4gns-logger' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     SHA256SUMS
      - name: Sign checksums (keyless)
        run: |
          cd dist
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
