name: Release binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  native:
    uses: ./.github/workflows/native-smoke.yml
  # Tag pushes are excluded from the normal CI triggers (push to main /
  # pull_request), so without this gate a release could publish binaries that
  # never ran the test suite, or whose baked-in appVersion disagrees with the
  # tag being released. Both are checked here before any artifact is built.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race -short ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Verify tag matches appVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          appVersion="$(sed -n 's/^const appVersion = "\(.*\)"/\1/p' cmd/w4gns-logger/main.go)"
          if [ -z "$appVersion" ]; then
            echo "could not read appVersion from main.go" >&2
            exit 1
          fi
          if [ "$tag" != "$appVersion" ]; then
            echo "tag v$tag does not match appVersion $appVersion in main.go" >&2
            exit 1
          fi
          echo "tag v$tag matches appVersion $appVersion"

  build:
    needs: [verify, native]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "w4gns-logger$ext" ./cmd/w4gns-logger

      - name: Package
        run: |
          name="w4gns-logger-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "$name.zip" w4gns-logger.exe README.md CHANGELOG.md LICENSE
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" w4gns-logger README.md CHANGELOG.md LICENSE
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
