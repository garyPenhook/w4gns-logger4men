name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native-smoke.yml
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # staticcheck is built fresh with this job's Go toolchain, so it always
      # understands the go.mod Go version's export format (a prebuilt binary
      # lags and fails to load newer std-library packages).
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go test ./...
      # -short skips the 100k-QSO import benchmark: the plain run above
      # already exercises it at full scale, and re-running the same
      # algorithm on 100k rows under race instrumentation (~20x slower)
      # tests nothing about concurrency that a smaller input wouldn't.
      - run: go test -race -short ./...
      - run: go build -buildvcs=false -o bin/w4gns-logger ./cmd/w4gns-logger
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
