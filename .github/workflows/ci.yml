name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build -buildvcs=false -o bin/w4gns-logger .
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
