name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      # -short skips the 100k-QSO import benchmark: the plain run above
      # already exercises it at full scale, and re-running the same
      # algorithm on 100k rows under race instrumentation (~20x slower)
      # tests nothing about concurrency that a smaller input wouldn't.
      - run: go test -race -short ./...
      - run: go build -buildvcs=false -o bin/w4gns-logger .
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
